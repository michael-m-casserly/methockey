.mchc-stats .mchc-name{text-align:left;white-space:normal;min-width:7.5em}
.mchc-stats td a{color:#0b5ed7;text-decoration:none;font-weight:600}
.mchc-stats td a:hover,.mchc-stats td a:focus{color:#344F7C;text-decoration:underline}
.mchc-stats tfoot td{font-size:.75rem;font-style:italic;color:#444;background:#fff;white-space:normal}
